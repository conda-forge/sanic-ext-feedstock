# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "25.12.0"
  # see https://github.com/sanic-org/sanic-ext/blob/v25.12.0/sanic_ext/bootstrap.py#L49
  sanic_min: "25.12.0"

package:
  name: sanic-ext
  version: ${{ version }}

source:
  - target_directory: dist
    url: https://pypi.org/packages/source/s/sanic-ext/sanic_ext-${{ version }}.tar.gz
    sha256: db6f5c8b880bb6b4cb73717b655b63aea4e77cf57825678ec74310fd69581ce1
    patches:
      - 0000-no-dupe-packages-find.diff
  - target_directory: src
    url: https://github.com/sanic-org/sanic-ext/archive/refs/tags/v${{ version }}.tar.gz
    sha256: f78f17d0e98148bc3610c0a3a34e946723436e96648ea93f4b89a5df0d80c584

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyyaml >=3.0.0
  run_constraints:
    - sanic >=${{ sanic_min }}

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/sanic-ext/**
      site_packages:
        - sanic_ext/**
        - sanic_ext-${{ version }}.dist-info/**
  - files:
      recipe:
        - run_test.py
      source:
        - src/tests/
        - src/pyproject.toml
    requirements:
      run:
        - attrs
        - jinja2
        - msgspec
        - pip
        - pydantic >=2
        - pytest-asyncio
        - pytest-cov >=7.1
        - pytest-xdist
        - python ${{ python_min }}.*
        - sanic
        - sanic-testing
    script:
      # manual, as can't be imported without `sanic`
      - pip check
      - python run_test.py

about:
  summary: Extend your Sanic installation with some core functionality.
  license: MIT
  license_file: dist/LICENSE
  homepage: http://github.com/sanic-org/sanic-ext
  documentation: https://sanic.dev/en/plugins/sanic-ext/getting-started.html

extra:
  recipe-maintainers:
    - bollwyvl
